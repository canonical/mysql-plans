name: Tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - '.github/renovate.json5'
  workflow_dispatch:
    inputs:
      mysql-channel:
        description: |
          Charmhub channel to deploy MySQL Server from (e.g. '8.0/beta')

          Defaults to the channel set in the terraform plan
        type: string
        default: ''

jobs:
  lint:
    name: Lint | ${{ matrix.path }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        path:
          - kubernetes
          - machines
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install terraform
        run: |
          sudo snap install terraform --classic
      - name: Install tox & poetry
        run: |
          pipx install tox
          pipx install poetry
      - name: Run linters
        working-directory: ${{ matrix.path }}
        run: |
          tox run -e lint
          tox run -e lint-terraform

  integration-test:
    name: Integration tests
    needs:
      - lint
    strategy:
      fail-fast: false
      matrix:
        path:
          - kubernetes
          - machines
    uses: ./.github/workflows/integration_test.yaml
    with:
      path-to-charm-directory: ${{ matrix.path }}
      mysql-channel: ${{ inputs.mysql-channel }}
    secrets: inherit
